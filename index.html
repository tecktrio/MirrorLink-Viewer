<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
    <title>MirrorLink Display | Signage Viewer</title>
</head>

<body>
    <!-- Full-screen presentation container for active images and videos -->
    <div id="slideshowContainer" onclick="enterFullscreen()"></div>

    <!-- Login & Standby HUD -->
    <div id="login_container">
        <!-- Ambient decorative glow backdrops -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <div id="container">
            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brand-badge">
                    <span class="status-dot"></span>
                    <span>Display Client v2.0</span>
                </div>
                <h1 class="brand-title">Mirror<span>Link</span></h1>
                <p class="brand-subtitle">Smart Digital Signage &amp; High-Definition Mirror Controller</p>
            </div>

            <!-- Ready / Start Banner (hidden by default until content loads) -->
            <div id="startBanner" style="display: none;">
                <div class="ready-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span>Media Loaded &amp; Ready</span>
                </div>
                <button onclick="enterFullscreen(); startSlideshow();" id="startButton" class="action-button start-button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Launch Full-Screen Presentation</span>
                </button>
            </div>

            <!-- Mirror Authentication Form -->
            <form onsubmit="Login(event)" id="loadingText" class="auth-form">
                <div id="error" class="error-banner" style="display: none;"></div>

                <div class="form-group">
                    <label for="mirror_name" class="label">Mirror Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="8" y1="21" x2="16" y2="21"></line>
                            <line x1="12" y1="17" x2="12" y2="21"></line>
                        </svg>
                        <input type="text" id="mirror_name" name="mirror_name" placeholder="e.g. Lobby Display" required class="inputbox" autocomplete="off" autofocus />
                    </div>
                    <p style="font-size: 11px; color: #94a3b8; margin-top: 6px; margin-bottom: 0;">
                        Enter the unique mirror name configured in MirrorLink.
                    </p>
                </div>

                <div class="button-group">
                    <button type="submit" class="login_button" id="login_button">
                        <span>Connect &amp; Stream Display</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                    <button type="button" class="login_button loading_state" style="display: none;" id="loading_button" disabled>
                        <span class="spinner"></span>
                        <span id="sync_status_text">Syncing Display Media...</span>
                    </button>
                </div>
            </form>

            <!-- Download Status text for JS backward compatibility -->
            <p style="display: none;" id="downloding"></p>

            <div class="footer-meta">
                <span>Managed securely via MirrorLink Cloud</span>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        // Observe error div text changes to toggle visibility cleanly
        const errEl = document.getElementById('error');
        if (errEl) {
            const observer = new MutationObserver(() => {
                errEl.style.display = errEl.innerText.trim() ? 'block' : 'none';
            });
            observer.observe(errEl, { childList: true, characterData: true, subtree: true });
        }
        // Observe startButton display changes to toggle startBanner visibility
        const startBtn = document.getElementById('startButton');
        const startBanner = document.getElementById('startBanner');
        if (startBtn && startBanner) {
            const btnObserver = new MutationObserver(() => {
                if (startBtn.style.display !== 'none') {
                    startBanner.style.display = 'block';
                }
            });
            btnObserver.observe(startBtn, { attributes: true, attributeFilter: ['style'] });
        }
    </script>
</body>

</html>
